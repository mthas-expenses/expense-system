{% extends 'base.html' %}
{% block title %}الفروع - الإعدادات{% endblock %}
{% block content %}

<div class="page-header">
    <h2>إدارة الفروع</h2>
</div>

<div class="card" style="max-width:500px; margin-bottom:15px;">
    <h3>إضافة فرع جديد</h3>
    <form method="POST">
        <div class="form-group">
            <label>اسم الفرع</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>العنوان</label>
            <input type="text" name="address">
        </div>
        <button type="submit" class="btn btn-primary">إضافة</button>
    </form>
</div>

<div class="table-wrapper">
    <table>
        <thead>
            <tr><th>#</th><th>اسم الفرع</th><th>العنوان</th><th></th></tr>
        </thead>
        <tbody>
            {% for b in branches %}
            <tr>
                <td>{{ b.id }}</td>
                <td><strong>{{ b.name }}</strong></td>
                <td class="text-muted">{{ b.address or '—' }}</td>
                <td>
                    <form method="POST" action="{{ url_for('admin_delete_branch', bid=b.id) }}" style="display:inline" onsubmit="return confirm('هل أنت متأكد من الحذف؟')">
                        <button type="submit" class="btn btn-sm btn-danger">حذف</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
